<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f6f6fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ROCD">
<title>ROCD · seguimiento</title>
<script>
  // Aplica el tema antes de pintar para evitar parpadeo.
  (function(){
    var m=localStorage.getItem('rocd_theme_v1')||'auto';
    var h=new Date().getHours();
    var dark = m==='dark' || (m==='auto' && (h>=19||h<7));
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  })();
</script>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f3f9;
    --card:#ffffff;
    --ink:#2b2b3a;
    --ink-soft:#5d5d70;
    --muted:#9a9aac;
    --line:#e9e9f2;
    --line-soft:#f1f1f7;
    --indigo:#5b5fd6;
    --indigo-deep:#4a4ec2;
    --good:#2fae7a;
    --good-ink:#1f8f63;
    --bad:#e25a82;
    --bad-ink:#c93f6a;
    --shadow:0 1px 2px rgba(40,40,70,.04), 0 8px 28px rgba(40,40,70,.06);
    --shadow-lg:0 12px 48px rgba(40,40,70,.18);
    /* colores de la gráfica (se adaptan al tema) */
    --c-axis:#9a9aac;
    --c-axis-dim:#c2c2d2;
    --c-ylab:#b9b9cb;
    --c-zero:#b6b6c8;
    --c-call-bg:#ffffff;
    --c-call-txt:#42425a;
    --c-call-line:#c7c7d8;
    --r:18px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  :root[data-theme="dark"]{
    --bg:#14141b;
    --card:#1e1e28;
    --ink:#e9e9f2;
    --ink-soft:#b6b6c6;
    --muted:#7f7f95;
    --line:#2c2c38;
    --line-soft:#24242e;
    --indigo:#7d80f0;
    --indigo-deep:#6b6fe6;
    --good:#34c08a;
    --good-ink:#46d49b;
    --bad:#f06a92;
    --bad-ink:#f783a6;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.38);
    --shadow-lg:0 12px 48px rgba(0,0,0,.55);
    --c-axis:#71718a;
    --c-axis-dim:#52526a;
    --c-ylab:#5e5e76;
    --c-zero:#43435a;
    --c-call-bg:#262631;
    --c-call-txt:#cfcfe0;
    --c-call-line:#3a3a4c;
  }
  /* ajustes puntuales para modo oscuro */
  [data-theme="dark"] header{background:rgba(20,20,27,.82)}
  [data-theme="dark"] .tabbar{background:rgba(24,24,32,.9)}
  [data-theme="dark"] .now-btn{background:#262631}
  [data-theme="dark"] input[type=datetime-local]:focus,
  [data-theme="dark"] textarea:focus{background:#1e1e28}
  [data-theme="dark"] input[type=range]{background:linear-gradient(90deg,#e25a82,#3a3a4c 50%,#2fae7a)}
  [data-theme="dark"] .btn-danger{background:#3a2230;color:#f783a6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(140px + var(--safe-b));
    overscroll-behavior-y:none;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 16px}

  /* TAB VIEWS */
  .view{display:none}
  .view.active{display:block}
  #viewGraf.active{display:flex;flex-direction:column;justify-content:center;
    min-height:calc(100dvh - 250px - var(--safe-b))}
  #viewGraf .chart-card{width:100%;margin:8px 0}

  /* SUMMARY (siempre una fila de 4 tarjetas compactas) */
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:2px 0 4px}
  .stat{background:var(--card);border-radius:13px;box-shadow:var(--shadow);padding:10px 4px 9px;text-align:center;min-width:0}
  .stat .k{font-size:8.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .v{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--ink);white-space:nowrap}
  .stat .s{font-size:9px;font-weight:600;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:360px){ .stat .v{font-size:17px} .stat{padding:9px 3px 8px} }
  .mini-charts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .mini-chart-card{padding:12px 8px 8px;margin:0;overflow:hidden}
  .mini-chart-head{padding:0 7px 4px}
  .mini-chart-head h3{font-size:13px;font-weight:800;letter-spacing:-.01em;margin:0;color:var(--ink)}
  .mini-chart-head p{font-size:10.5px;font-weight:600;color:var(--muted);margin:2px 0 0}
  .mini-chart-empty{height:124px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:11.5px;font-weight:600;padding:0 10px;line-height:1.35}
  .relation{font-size:12px;color:var(--ink-soft);font-weight:600;line-height:1.45;text-align:center;margin:9px 8px 0}
  @media(max-width:430px){ .mini-charts{grid-template-columns:1fr} }

  /* TAB BAR */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;
    display:flex;max-width:680px;margin:0 auto;
    background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
  .tab{flex:1;background:none;border:none;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 0 8px;color:var(--muted);font-size:11px;font-weight:600;transition:color .15s}
  .tab svg{width:23px;height:23px}
  .tab.active{color:var(--indigo)}
  .tab:active{opacity:.6}

  /* HEADER */
  header{
    position:sticky;top:0;z-index:40;
    background:rgba(243,243,249,.82);backdrop-filter:saturate(180%) blur(14px);
    padding-top:calc(10px + var(--safe-t));
    border-bottom:1px solid transparent;transition:border-color .2s;
  }
  header.scrolled{border-color:var(--line)}
  .head-row{display:flex;align-items:center;gap:10px;padding:8px 0 12px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--indigo),#7d80e8);
    display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(91,95,214,.35)}
  .logo svg{width:17px;height:17px}
  .brand h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{font-size:10.5px;color:var(--muted);font-weight:500;margin-top:1px}
  .icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);
    display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink-soft);transition:.15s}
  .icon-btn:active{transform:scale(.93)}
  .icon-btn svg{width:18px;height:18px}
  .sync{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);font-weight:500;
    padding:0 4px;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
  .dot.ok{background:var(--good)}
  .dot.off{background:#e0a23a}
  .dot.err{background:var(--bad)}
  .dot.sync{background:var(--indigo);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* CARD */
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin:14px 0}
  .chart-card{padding:16px 8px 10px 8px;overflow:hidden}
  .chart-head{padding:4px 10px 2px}
  .chart-title{font-size:21px;font-weight:800;letter-spacing:-.03em;margin:0;color:#34344a;line-height:1.15;cursor:pointer}
  .chart-title .pencil{opacity:0;margin-left:6px;font-size:13px;color:var(--muted);transition:.2s}
  .chart-title:hover .pencil{opacity:1}
  .chart-cap{font-size:11.5px;color:var(--muted);font-weight:500;margin:5px 0 2px;padding:0 10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .chart-cap b{color:var(--good-ink);font-weight:600}
  .chart-cap .neu{color:var(--ink-soft);font-weight:600}
  .chart-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chart-scroll::-webkit-scrollbar{display:none}
  svg.chart{display:block;touch-action:pan-x}
  .chart-empty{padding:30px 18px 40px;text-align:center}
  .chart-empty .ill{width:100%;max-width:300px;margin:0 auto 14px;opacity:.9}
  .chart-empty h3{font-size:16px;margin:0 0 5px;color:var(--ink)}
  .chart-empty p{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.5}

  /* LIST */
  .section-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 8px}
  .section-h h2{font-size:13px;font-weight:700;letter-spacing:.02em;margin:0;color:var(--ink)}
  .section-h .count{font-size:12px;color:var(--muted);font-weight:600}
  .list{display:flex;flex-direction:column;gap:9px}
  .entry{background:var(--card);border-radius:15px;box-shadow:var(--shadow);padding:13px 14px 13px 16px;
    display:flex;gap:13px;align-items:flex-start;position:relative;overflow:hidden;cursor:pointer;
    transition:transform .12s}
  .entry:active{transform:scale(.992)}
  .entry .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
  .entry .val{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
    font-size:19px;font-weight:800;letter-spacing:-.04em}
  .entry .mid{flex:1;min-width:0}
  .entry .when{font-size:12.5px;font-weight:600;color:var(--ink)}
  .entry .mood{font-size:11px;font-weight:600;margin-top:1px}
  .entry .cmt{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .entry .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .entry .tag{font-size:10.5px;font-weight:700;border-radius:999px;padding:4px 7px;line-height:1}
  .entry .ago{font-size:10.5px;color:var(--muted);margin-top:6px}
  .entry .chev{align-self:center;color:var(--line);flex:none}

  /* FAB */
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + var(--safe-b));z-index:46;
    height:54px;padding:0 24px 0 20px;border:none;border-radius:30px;cursor:pointer;
    background:linear-gradient(135deg,var(--indigo),#7d80e8);color:#fff;font-family:inherit;
    font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;
    box-shadow:0 10px 30px rgba(91,95,214,.45);transition:transform .15s}
  .fab:active{transform:translateX(-50%) scale(.95)}
  .fab svg{width:20px;height:20px}

  /* SHEET / MODAL */
  .scrim{position:fixed;inset:0;z-index:60;background:rgba(28,28,46,.42);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .26s}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);
    border-radius:26px 26px 0 0;padding:8px 18px calc(20px + var(--safe-b));
    max-width:680px;margin:0 auto;transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,0,1);
    max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
  .sheet.show{transform:translateY(0)}
  .grab{width:38px;height:4.5px;border-radius:3px;background:var(--line);margin:8px auto 4px}
  .sheet h2{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:8px 2px 2px}
  .sheet .lead{font-size:12.5px;color:var(--muted);margin:0 2px 18px}

  .field{margin-bottom:18px}
  .field>label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    color:var(--muted);margin-bottom:9px}
  .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
  .metric-grid .field{margin-bottom:0}
  .metric-val{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
  .metric-num{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ink)}
  .metric-mood{font-size:11px;font-weight:700;color:var(--muted);text-align:right}
  .metric-grid .ticks{font-size:9.5px}
  input[type=range].toc-range{background:linear-gradient(90deg,#2fae7a,#eceaf0 50%,#e25a82)}
  input[type=range].sleep-range{background:linear-gradient(90deg,#e25a82,#eceaf0 50%,#2fae7a)}
  [data-theme="dark"] input[type=range].toc-range{background:linear-gradient(90deg,#2fae7a,#3a3a4c 50%,#e25a82)}
  [data-theme="dark"] input[type=range].sleep-range{background:linear-gradient(90deg,#e25a82,#3a3a4c 50%,#2fae7a)}
  @media(max-width:430px){ .metric-grid{grid-template-columns:1fr} }

  /* slider */
  .slider-val{text-align:center;margin-bottom:6px}
  .slider-num{font-size:50px;font-weight:800;letter-spacing:-.04em;line-height:1}
  .slider-mood{font-size:14px;font-weight:700;margin-top:3px}
  .srow{display:flex;align-items:center;gap:10px}
  .srow .end{font-size:16px;flex:none}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:6px;
    background:linear-gradient(90deg,#e25a82,#eceaf0 50%,#2fae7a);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    background:#fff;border:3px solid var(--indigo);box-shadow:0 3px 10px rgba(40,40,70,.25);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;
    border:3px solid var(--indigo);box-shadow:0 3px 10px rgba(40,40,70,.25);cursor:pointer}
  .ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:600;margin-top:7px;padding:0 2px}

  input[type=datetime-local],textarea{width:100%;font-family:inherit;font-size:15px;color:var(--ink);
    background:var(--line-soft);border:1.5px solid transparent;border-radius:13px;padding:13px 14px;outline:none;transition:.15s}
  input[type=datetime-local]:focus,textarea:focus{border-color:var(--indigo);background:#fff}
  textarea{resize:none;min-height:80px;line-height:1.5}
  .when-row{display:flex;gap:8px}
  .when-row input{flex:1}
  .now-btn{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:0 14px;
    font-family:inherit;font-size:12.5px;font-weight:700;color:var(--indigo);cursor:pointer}
  .now-btn:active{transform:scale(.95)}

  .sheet-actions{display:flex;gap:10px;margin-top:6px}
  .btn{flex:1;height:52px;border-radius:15px;border:none;font-family:inherit;font-size:15px;font-weight:700;
    cursor:pointer;transition:transform .12s}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:linear-gradient(135deg,var(--indigo),#7d80e8);color:#fff;box-shadow:0 8px 22px rgba(91,95,214,.4)}
  .btn-ghost{flex:none;width:52px;background:var(--line-soft);color:var(--ink-soft);font-size:20px}
  .btn-danger{background:#fdeef2;color:var(--bad-ink)}
  .link-row{text-align:center;margin-top:14px}
  .link-row button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:12.5px;
    font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

  /* menu */
  .menu{position:fixed;top:0;right:0;z-index:62;background:var(--card);border-radius:16px;box-shadow:var(--shadow-lg);
    padding:6px;min-width:212px;transform:scale(.9);opacity:0;pointer-events:none;transition:.16s;transform-origin:top right;
    margin-top:calc(58px + var(--safe-t));margin-right:14px}
  .menu.show{transform:scale(1);opacity:1;pointer-events:auto}
  .menu button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;font-family:inherit;
    font-size:14px;font-weight:600;color:var(--ink);padding:11px 12px;border-radius:11px;cursor:pointer;text-align:left}
  .menu button:active{background:var(--line-soft)}
  .menu button svg{width:17px;height:17px;color:var(--muted);flex:none}
  .menu button.danger{color:var(--bad-ink)}
  .menu button.danger svg{color:var(--bad-ink)}
  .menu hr{border:none;border-top:1px solid var(--line);margin:5px 8px}

  /* tooltip */
  .tip{position:absolute;z-index:30;background:#2b2b3a;color:#fff;border-radius:12px;padding:9px 12px;
    font-size:12px;line-height:1.4;max-width:220px;pointer-events:none;opacity:0;transition:opacity .14s;
    box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translate(-50%,-100%)}
  .tip.show{opacity:1}
  .tip .t-val{font-weight:800;font-size:14px}
  .tip .t-date{opacity:.7;font-size:10.5px;margin-bottom:3px}
  .tip:after{content:'';position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:#2b2b3a;
    transform:translateX(-50%) rotate(45deg)}

  /* toast */
  .toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translate(-50%,20px);z-index:80;
    background:#2b2b3a;color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:24px;
    box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.24s;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .modal-box{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);z-index:70;
    background:var(--card);border-radius:22px;padding:24px 22px;width:calc(100% - 40px);max-width:380px;
    box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.2s}
  .modal-box.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  .modal-box h3{margin:0 0 8px;font-size:17px;font-weight:800}
  .modal-box p{margin:0 0 18px;font-size:13.5px;color:var(--ink-soft);line-height:1.5}
  .modal-box pre{background:var(--line-soft);border-radius:12px;padding:12px;font-size:11px;line-height:1.5;
    overflow-x:auto;color:var(--ink);margin:0 0 16px;white-space:pre-wrap;font-family:ui-monospace,monospace}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-row">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 17l5-6 4 4 5-8 4 5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div style="min-width:0">
          <h1>Seguimiento ROCD</h1>
          <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">cargando…</span></div>
        </div>
      </div>
      <button class="icon-btn" id="menuBtn" aria-label="Menú">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="viewGraf" class="view active">
    <section class="card chart-card" id="chartCard">
      <div class="chart-head">
        <h2 class="chart-title" id="chartTitle"><span id="chartTitleTxt">mi recuperación de ROCD</span><span class="pencil">✎</span></h2>
        <div class="chart-cap"><span>↑ <b>mejor</b></span><span>·</span><span class="neu">0 = neutral</span><span>·</span><span style="color:var(--bad-ink);font-weight:600">↓ peor</span></div>
      </div>
      <div class="chart-scroll" id="chartScroll"></div>
    </section>
    <div class="summary" id="summary"></div>
    <section class="mini-charts" aria-label="TOC y sueño">
      <section class="card mini-chart-card">
        <div class="mini-chart-head">
          <h3>TOC</h3>
          <p>0 bajo · 10 alto</p>
        </div>
        <div class="chart-scroll" id="tocChart"></div>
      </section>
      <section class="card mini-chart-card">
        <div class="mini-chart-head">
          <h3>Sueño</h3>
          <p>0 mal · 10 bien</p>
        </div>
        <div class="chart-scroll" id="sleepChart"></div>
      </section>
    </section>
    <div class="relation" id="relation"></div>
  </section>

  <section id="viewHist" class="view">
    <div class="section-h">

<script>
/* ════════════════════════════ CONFIG ════════════════════════════ */
const SUPABASE_URL = 'https://fexfeekifzgszluemihs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Elra9S5SZVWELp6MvKSyoA_iBW5KqD2';
const TABLE = 'rocd_entries';
const LS_KEY = 'rocd_entries_v1';
const LS_TITLE = 'rocd_title_v1';
const LS_QUEUE = 'rocd_queue_v1';

const SETUP_SQL =
`create table if not exists public.rocd_entries (
  id uuid primary key,
  at timestamptz not null,
  value int2 not null,
  toc int2,
  sleep int2,
  comment text,
  updated_at timestamptz not null default now()
);
alter table public.rocd_entries add column if not exists toc int2;
alter table public.rocd_entries add column if not exists sleep int2;
alter table public.rocd_entries enable row level security;
create policy "anon full access" on public.rocd_entries
  for all to anon using (true) with check (true);`;

/* ════════════════════════════ STATE ════════════════════════════ */
let entries = [];          // {id, at(ISO), value(int), toc(int?), sleep(int?), comment, updated_at}
let title = localStorage.getItem(LS_TITLE) || 'mi recuperación de ROCD';
let editingId = null;
let sb = null;
let online = false, tableMissing = false, schemaMissing = false;

/* ════════════════════════════ UTIL ════════════════════════════ */
const $ = s => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=='x'?r:(r&0x3|0x8)).toString(16)}));
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONTHS_LONG = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function moodLabel(v){
  if(v>=8)return['Muy bien','#1f8f63'];
  if(v>=4)return['Bien','#2fae7a'];
  if(v>=1)return['Algo mejor','#5aa86d'];
  if(v===0)return['Neutral','#7d7d92'];
  if(v>=-3)return['Algo peor','#d98a64'];
  if(v>=-7)return['Mal','#e25a82'];
  return['Muy mal','#c93f6a'];
}
function valColor(v){
  if(v>0) return '#2fae7a';
  if(v<0) return '#e25a82';
  return '#8a8a9a';
}
function metricValue(v){
  if(v===null||v===undefined||v==='') return null;
  const n=Math.round(Number(v));
  return Number.isFinite(n) ? Math.max(0, Math.min(10, n)) : null;
}
function tocLabel(v){
  if(v<=2)return['Bajo','#2fae7a'];
  if(v<=5)return['Medio','#d98a64'];
  if(v<=7)return['Alto','#e25a82'];
  return['Muy alto','#c93f6a'];
}
function sleepLabel(v){
  if(v>=8)return['Muy bien','#1f8f63'];
  if(v>=6)return['Bien','#2fae7a'];
  if(v>=4)return['Regular','#d98a64'];
  return['Mal','#e25a82'];
}
function metricColor(kind,v){
  if(kind==='toc') return tocLabel(v)[1];
  return sleepLabel(v)[1];
}
function normalizeEntry(e){
  return {
    id:e.id||uid(),
    at:e.at,
    value:+e.value,
    toc:metricValue(e.toc),
    sleep:metricValue(e.sleep),
    comment:e.comment||'',
    updated_at:e.updated_at
  };
}
function fmtFull(iso){
  const d=new Date(iso);
  return `${d.getDate()} ${MONTHS_LONG[d.getMonth()]} ${d.getFullYear()}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function ago(iso){
  const s=(Date.now()-new Date(iso))/1000;
  if(s<0)return'en el futuro';
  if(s<60)return'ahora mismo';
  const m=s/60; if(m<60)return`hace ${Math.floor(m)} min`;
  const h=m/60; if(h<24)return`hace ${Math.floor(h)} h`;
  const d=h/24; if(d<30)return`hace ${Math.floor(d)} d`;
  const mo=d/30.44; if(mo<12)return`hace ${Math.floor(mo)} mes${Math.floor(mo)>1?'es':''}`;
  return`hace ${Math.floor(d/365)} año(s)`;
}
function toLocalInput(d){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ════════════════════════════ STORAGE ════════════════════════════ */
function saveLocal(){ localStorage.setItem(LS_KEY, JSON.stringify(entries)); }
function loadLocal(){ try{ entries = (JSON.parse(localStorage.getItem(LS_KEY))||[]).map(normalizeEntry); }catch(e){ entries=[]; } }
function getQueue(){ try{ return JSON.parse(localStorage.getItem(LS_QUEUE))||[]; }catch(e){ return []; } }
function setQueue(q){ localStorage.setItem(LS_QUEUE, JSON.stringify(q)); }
function enqueue(op){ const q=getQueue().filter(x=>x.id!==op.id); q.push(op); setQueue(q); }

/* ════════════════════════════ SYNC ════════════════════════════ */
function setStatus(state,txt){
  const dot=$('#syncDot'), t=$('#syncTxt');
  dot.className='dot '+state; t.textContent=txt;
}
function schemaError(err){
  const msg=(err&&(err.message||err.code||err.hint||err.details))||'';
  return /toc|sleep|column|schema cache|PGRST204|Could not find/i.test(String(msg));
}
function syncRow(e){
  const row={id:e.id,at:e.at,value:e.value,comment:e.comment||null,updated_at:new Date().toISOString()};
  if(e.toc!==null&&e.toc!==undefined) row.toc=e.toc;
  if(e.sleep!==null&&e.sleep!==undefined) row.sleep=e.sleep;
  return row;
}
async function initSupabase(){
  if(typeof supabase==='undefined'||!supabase.createClient){
    setStatus('off','solo en el dispositivo'); return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY,{auth:{persistSession:false}});
  await pull();
  flushQueue();
}
async function pull(){
  if(!sb) return;
  setStatus('sync','sincronizando…');
  try{
    const {data,error}=await sb.from(TABLE).select('*').order('at',{ascending:true});
    if(error) throw error;
    online=true; tableMissing=false; schemaMissing=false;
    const queuedIds=new Set(getQueue().map(q=>q.id));
    const remote=(data||[]).map(normalizeEntry);
    const localExtra=entries.filter(e=>queuedIds.has(e.id) && !remote.some(r=>r.id===e.id));
    entries=[...remote,...localExtra];
    saveLocal(); render();
    setStatus('ok','sincronizado');
  }catch(err){
    online=false;
    const msg=(err&&(err.message||err.code||err.hint))||'';
    if(/relation|does not exist|42P01|schema cache|find the table|Could not find the/i.test(msg)){
      tableMissing=true; setStatus('err','falta configurar');
    }else{
      setStatus('off','solo en el dispositivo');
    }
    console.warn('pull failed:',err);
  }
}
async function flushQueue(){
  if(!sb||!online) return;
  const q=getQueue();
  if(!q.length) return;
  setStatus('sync','guardando…');
  const remaining=[];
  for(const op of q){
    try{
      if(op.type==='delete'){
        const {error}=await sb.from(TABLE).delete().eq('id',op.id); if(error) throw error;
      }else{
        const {error}=await sb.from(TABLE).upsert(op.row); if(error) throw error;
      }
    }catch(e){
      remaining.push(op); online=false;
      if(schemaError(e)){ schemaMissing=true; setStatus('err','actualiza Supabase'); }
    }
  }
  setQueue(remaining);
  if(!schemaMissing) setStatus(online?'ok':'off', online?'sincronizado':'solo en el dispositivo');
}
async function pushUpsert(e){
  const row=syncRow(e);
  enqueue({type:'upsert',id:e.id,row});
  if(sb&&online){
    try{ const {error}=await sb.from(TABLE).upsert(row); if(error)throw error;
      setQueue(getQueue().filter(q=>q.id!==e.id)); schemaMissing=false; setStatus('ok','sincronizado');
    }catch(err){
      online=false;
      if(schemaError(err)){ schemaMissing=true; setStatus('err','actualiza Supabase'); }
      else setStatus('off','solo en el dispositivo');
    }
  }
}
async function pushDelete(id){
  enqueue({type:'delete',id});
  if(sb&&online){
    try{ const {error}=await sb.from(TABLE).delete().eq('id',id); if(error)throw error;
      setQueue(getQueue().filter(q=>q.id!==id)); setStatus('ok','sincronizado');
    }catch(err){ online=false; setStatus('off','solo en el dispositivo'); }
  }
}

/* ════════════════════════════ CRUD ════════════════════════════ */
function upsertEntry(data){
  data=normalizeEntry(data);
  let id;
  if(data.id){
    id=data.id;
    const i=entries.findIndex(e=>e.id===data.id);
    if(i>=0) entries[i]={...entries[i],...data};
  }else{
    id=data.id=uid(); entries.push(data);
  }
  saveLocal(); render(); pushUpsert(entries.find(e=>e.id===id));
}
function deleteEntry(id){
  entries=entries.filter(e=>e.id!==id);
  saveLocal(); render(); pushDelete(id);
}

/* ════════════════════════════ CHART ════════════════════════════ */
function monotoneTangents(pts){
  const n=pts.length, m=new Array(n).fill(0), d=new Array(n-1);
  for(let i=0;i<n-1;i++){ d[i]=(pts[i+1].y-pts[i].y)/((pts[i+1].x-pts[i].x)||1e-9); }
  m[0]=d[0]; m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++){ m[i]=(d[i-1]*d[i]<=0)?0:(d[i-1]+d[i])/2; }
  for(let i=0;i<n-1;i++){
    if(d[i]===0){ m[i]=0; m[i+1]=0; continue; }
    const a=m[i]/d[i], b=m[i+1]/d[i], h=Math.hypot(a,b);
    if(h>3){ const t=3/h; m[i]=t*a*d[i]; m[i+1]=t*b*d[i]; }
  }
  return m;
}
function smoothPath(pts){
  if(pts.length===0) return '';
  if(pts.length===1) return `M${pts[0].x},${pts[0].y}`;
  const m=monotoneTangents(pts);
  let p=`M${pts[0].x.toFixed(2)},${pts[0].y.toFixed(2)}`;
  for(let i=0;i<pts.length-1;i++){
    const dx=(pts[i+1].x-pts[i].x)/3;
    const c1x=pts[i].x+dx, c1y=pts[i].y+m[i]*dx;
    const c2x=pts[i+1].x-dx, c2y=pts[i+1].y-m[i+1]*dx;
    p+=`C${c1x.toFixed(2)},${c1y.toFixed(2)} ${c2x.toFixed(2)},${c2y.toFixed(2)} ${pts[i+1].x.toFixed(2)},${pts[i+1].y.toFixed(2)}`;
  }
  return p;
}
function timeTicks(min,max){
  const day=86400000, span=max-min;
  const ticks=[];
  if(span<=0){ const d=new Date(min); return [{t:min,m:MONTHS[d.getMonth()],y:d.getFullYear()}]; }
  if(span < 80*day){
    const niceDays=[1,2,3,7,14,30];
    let step=(niceDays.find(s=>span/(s*day)<=6)||30)*day;
    let start=Math.ceil(min/step)*step;
    for(let t=start;t<=max+1;t+=step){ const d=new Date(t); ticks.push({t,day:d.getDate(),m:MONTHS[d.getMonth()]}); }
  }else{
    const totalM=span/day/30.44;
    const stepM=Math.max(1,Math.round(totalM/5));
    let d=new Date(min); d.setDate(1); d.setHours(0,0,0,0);
    if(d.getTime()<min) d.setMonth(d.getMonth()+1);
    while(d.getTime()<=max){ ticks.push({t:d.getTime(),m:MONTHS[d.getMonth()],y:d.getFullYear()}); d.setMonth(d.getMonth()+stepM); }
  }
  if(ticks.length<2){ const a=new Date(min),b=new Date(max); return [{t:min,m:MONTHS[a.getMonth()],y:a.getFullYear()},{t:max,m:MONTHS[b.getMonth()],y:b.getFullYear()}]; }
  return ticks;
}
function wrapText(s,max){
  const words=s.replace(/\s+/g,' ').trim().split(' '), lines=[]; let cur='';
  for(const w of words){
    if(lines.length>=3) break;
    if((cur+' '+w).trim().length<=max){ cur=(cur+' '+w).trim(); }
    else{ if(cur)lines.push(cur); cur=w.length>max?w.slice(0,max-1)+'…':w; }
  }
  if(cur&&lines.length<3)lines.push(cur);
  return lines.slice(0,3);
}

function renderChart(){
  const host=$('#chartScroll');
  const data=[...entries].sort((a,b)=>new Date(a.at)-new Date(b.at));
  if(data.length===0){
    host.innerHTML=`<div class="chart-empty">
      <svg class="ill" viewBox="0 0 300 130" fill="none">
        <line x1="20" y1="65" x2="285" y2="65" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 5"/>
        <path d="M22 86 C60 80 70 40 110 44 S150 95 185 72 230 30 283 34" stroke="var(--c-zero)" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>
      <h3>Aún no hay registros</h3>
      <p>Añade tu primera entrada para empezar a ver tu evolución.</p>
      <button class="btn btn-primary" style="max-width:240px;margin:0 auto;height:48px" onclick="openSheet()">＋ Añadir primera entrada</button>
    </div>`;
    return;
  }

  const cw=Math.max(320,(host.clientWidth|| (document.querySelector('.wrap').clientWidth-16)));
  const minStep=46;
  const needed=data.length*minStep+80;
  const W=Math.round(Math.max(cw, Math.min(needed, cw*2.4)));
  const vh=window.innerHeight||720;
  const H=Math.round(Math.max(290, Math.min(vh-410, 520)));
  const M={l:30,r:18,t:34,b:42};
  const pw=W-M.l-M.r, ph=H-M.t-M.b;

  let tmin=new Date(data[0].at).getTime(), tmax=new Date(data[data.length-1].at).getTime();
  if(tmin===tmax){ tmin-=86400000; tmax+=86400000; }
  const pad=(tmax-tmin)*0.04; tmin-=pad; tmax+=pad;
  const VMAX=10;
  const X=t=>M.l+((t-tmin)/(tmax-tmin))*pw;
  const Y=v=>M.t+((VMAX-v)/(VMAX*2))*ph;
  const y0=Y(0);

  const pts=data.map(d=>({x:X(new Date(d.at).getTime()), y:Y(Math.max(-VMAX,Math.min(VMAX,d.value))), d}));
  const line=smoothPath(pts);
  const area=line+` L${pts[pts.length-1].x.toFixed(2)},${y0.toFixed(2)} L${pts[0].x.toFixed(2)},${y0.toFixed(2)} Z`;

  let grid='';
  for(const gv of [10,5,-5,-10]){
    const gy=Y(gv);
    grid+=`<line x1="${M.l}" y1="${gy.toFixed(1)}" x2="${W-M.r}" y2="${gy.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>`;
    grid+=`<text x="${M.l-7}" y="${(gy+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--c-ylab)" font-weight="600">${gv>0?'+'+gv:gv}</text>`;
  }
  let xax='';
  for(const tk of timeTicks(tmin+pad,tmax-pad)){
    const tx=X(tk.t); if(tx<M.l-2||tx>W-M.r+2)continue;
    xax+=`<line x1="${tx.toFixed(1)}" y1="${M.t}" x2="${tx.toFixed(1)}" y2="${(H-M.b).toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>`;
    if(tk.day){
      xax+=`<text x="${tx.toFixed(1)}" y="${(H-M.b+16).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="var(--c-axis)" font-weight="600">${tk.day} ${tk.m}</text>`;
    }else{
      xax+=`<text x="${tx.toFixed(1)}" y="${(H-M.b+15).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="var(--c-axis)" font-weight="600">${tk.m}</text>`;
      xax+=`<text x="${tx.toFixed(1)}" y="${(H-M.b+27).toFixed(1)}" text-anchor="middle" font-size="9" fill="var(--c-axis-dim)" font-weight="500">${tk.y}</text>`;
    }
  }

  let dots='';
  pts.forEach((p,i)=>{
    const c=valColor(p.d.value);
    const hasC=p.d.comment&&p.d.comment.trim();
    dots+=`<circle class="pt" data-i="${i}" cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${hasC?4.2:3.4}"
      fill="${hasC?c:'var(--card)'}" stroke="${c}" stroke-width="2" style="cursor:pointer"/>`;
    dots+=`<circle class="hit" data-i="${i}" cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="16" fill="transparent" style="cursor:pointer"/>`;
  });

  const placed=[]; let calls='';
  const withC=pts.map((p,i)=>({p,i})).filter(o=>o.p.d.comment&&o.p.d.comment.trim());
  const overlap=(a,b)=>!(a.x2<b.x1-6||a.x1>b.x2+6||a.y2<b.y1-5||a.y1>b.y2+5);
  for(const {p} of withC){
    const lines=wrapText(p.d.comment.trim(), 17);
    const lh=12.5, padX=8, padY=6;
    const bw=Math.min(140, Math.max(...lines.map(l=>l.length))*6.0+padX*2);
    const bh=lines.length*lh+padY*2;
    const offs=[];
    const above=p.y>y0;
    const dirs=above?[-1,1]:[1,-1];
    for(const dir of dirs){ for(const dist of [30,52,76,102,128]){ offs.push({dx:0,dy:dir*dist}); } }
    for(const dir of dirs){ for(const dist of [34,60,88]){ offs.push({dx:-bw*0.5-10,dy:dir*dist},{dx:bw*0.5+10,dy:dir*dist}); } }
    let chosen=null;
    for(const o of offs){
      let cx=p.x+o.dx, cy=p.y+o.dy;
      let x1=cx-bw/2, x2=cx+bw/2, y1=cy-bh/2, y2=cy+bh/2;
      if(x1<M.l-6){const s=M.l-6-x1;x1+=s;x2+=s;cx+=s;}
      if(x2>W-M.r+6){const s=x2-(W-M.r+6);x1-=s;x2-=s;cx-=s;}
      if(y1<4||y2>H-M.b-2) continue;
      const box={x1,x2,y1,y2,cx,cy};
      if(placed.some(pl=>overlap(box,pl))) continue;
      chosen=box; break;
    }
    if(!chosen) continue;
    placed.push(chosen);
    const c=valColor(p.d.value);
    const ex=Math.max(chosen.x1+6,Math.min(chosen.x2-6,p.x));
    const ey=chosen.cy<p.y?chosen.y2:chosen.y1;
    calls+=`<path d="M${p.x.toFixed(1)},${p.y.toFixed(1)} L${ex.toFixed(1)},${ey.toFixed(1)}" stroke="var(--c-call-line)" stroke-width="1" fill="none"/>`;
    calls+=`<rect x="${chosen.x1.toFixed(1)}" y="${chosen.y1.toFixed(1)}" rx="7" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}"
      fill="var(--c-call-bg)" stroke="${c}55" stroke-width="1" filter="url(#sh)"/>`;
    lines.forEach((ln,k)=>{
      calls+=`<text x="${chosen.cx.toFixed(1)}" y="${(chosen.y1+padY+lh*k+9.5).toFixed(1)}" text-anchor="middle"
        font-size="9.6" fill="var(--c-call-txt)" font-weight="500">${esc(ln)}</text>`;
    });
  }

  host.innerHTML=`<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet">
    <defs>
      <linearGradient id="gGood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2fae7a" stop-opacity="0.30"/>
        <stop offset="1" stop-color="#2fae7a" stop-opacity="0.04"/>
      </linearGradient>
      <linearGradient id="gBad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e25a82" stop-opacity="0.05"/>
        <stop offset="1" stop-color="#e25a82" stop-opacity="0.26"/>
      </linearGradient>
      <clipPath id="clipUp"><rect x="0" y="${(M.t-2).toFixed(1)}" width="${W}" height="${(y0-M.t+2).toFixed(1)}"/></clipPath>
      <clipPath id="clipDn"><rect x="0" y="${y0.toFixed(1)}" width="${W}" height="${(H-M.b-y0+2).toFixed(1)}"/></clipPath>
      <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#2b2b3a" flood-opacity="0.10"/>
      </filter>
    </defs>
    ${grid}${xax}
    <path d="${area}" fill="url(#gGood)" clip-path="url(#clipUp)"/>
    <path d="${area}" fill="url(#gBad)" clip-path="url(#clipDn)"/>
    <line x1="${M.l}" y1="${y0.toFixed(1)}" x2="${W-M.r}" y2="${y0.toFixed(1)}" stroke="var(--c-zero)" stroke-width="1.3"/>
    <path d="${line}" fill="none" stroke="var(--indigo)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    ${calls}
    ${dots}
  </svg>`;

  host.querySelectorAll('.hit,.pt').forEach(el=>{
    el.addEventListener('click',ev=>{ ev.stopPropagation(); showTip(pts[+el.dataset.i]); });
  });
}

function renderMetricChart(hostId, kind){
  const host=$('#'+hostId);
  if(!host) return;
  const data=[...entries]
    .map(e=>({...e, metric:metricValue(e[kind])}))
    .filter(e=>e.metric!==null)
    .sort((a,b)=>new Date(a.at)-new Date(b.at));
  if(!data.length){
    host.innerHTML=`<div class="mini-chart-empty">Añade registros con ${kind==='toc'?'TOC':'sueño'} para ver la gráfica.</div>`;
    return;
  }

  const cw=Math.max(260,(host.clientWidth||300));
  const minStep=38;
  const needed=data.length*minStep+58;
  const W=Math.round(Math.max(cw, Math.min(needed, cw*2.1)));
  const H=138;
  const M={l:24,r:12,t:14,b:25};
  const pw=W-M.l-M.r, ph=H-M.t-M.b;
  let tmin=new Date(data[0].at).getTime(), tmax=new Date(data[data.length-1].at).getTime();
  if(tmin===tmax){ tmin-=86400000; tmax+=86400000; }
  const pad=(tmax-tmin)*0.05; tmin-=pad; tmax+=pad;
  const X=t=>M.l+((t-tmin)/(tmax-tmin))*pw;
  const Y=v=>M.t+((10-v)/10)*ph;
  const pts=data.map(d=>({x:X(new Date(d.at).getTime()), y:Y(d.metric), d}));
  const line=smoothPath(pts);
  const area=line+` L${pts[pts.length-1].x.toFixed(2)},${H-M.b} L${pts[0].x.toFixed(2)},${H-M.b} Z`;
  const stroke=kind==='toc'?'#e25a82':'#2fae7a';

  let grid='';
  for(const gv of [0,5,10]){
    const gy=Y(gv);
    grid+=`<line x1="${M.l}" y1="${gy.toFixed(1)}" x2="${W-M.r}" y2="${gy.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>`;
    grid+=`<text x="${M.l-6}" y="${(gy+3.5).toFixed(1)}" text-anchor="end" font-size="8.5" fill="var(--c-ylab)" font-weight="600">${gv}</text>`;
  }
  let xax='';
  for(const tk of timeTicks(tmin+pad,tmax-pad)){
    const tx=X(tk.t); if(tx<M.l-2||tx>W-M.r+2)continue;
    xax+=`<text x="${tx.toFixed(1)}" y="${(H-8).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="var(--c-axis)" font-weight="600">${tk.day?tk.day+' '+tk.m:tk.m}</text>`;
  }
  const dots=pts.map((p,i)=>{
    const c=metricColor(kind,p.d.metric);
    return `<circle class="mpt" data-kind="${kind}" data-i="${i}" cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="3.4" fill="var(--card)" stroke="${c}" stroke-width="2" style="cursor:pointer"/>
      <circle class="mhit" data-kind="${kind}" data-i="${i}" cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="14" fill="transparent" style="cursor:pointer"/>`;
  }).join('');

  host.innerHTML=`<svg class="chart mini-chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet">
    <defs>
      <linearGradient id="gm_${kind}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${stroke}" stop-opacity="0.22"/>
        <stop offset="1" stop-color="${stroke}" stop-opacity="0.03"/>
      </linearGradient>
    </defs>
    ${grid}${xax}
    <path d="${area}" fill="url(#gm_${kind})"/>
    <path d="${line}" fill="none" stroke="${stroke}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
  host.querySelectorAll('.mhit,.mpt').forEach(el=>{
    el.addEventListener('click',ev=>{ ev.stopPropagation(); showMetricTip(pts[+el.dataset.i],kind,host); });
  });
}

/* ════════════════════════════ SUMMARY ════════════════════════════ */
function computeSummary(){
  const data=[...entries].sort((a,b)=>new Date(a.at)-new Date(b.at));
  if(!data.length) return null;
  const vals=data.map(e=>e.value);
  const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
  const in30=data.filter(e=>new Date(e.at).getTime()>=Date.now()-30*86400000);
  const media= in30.length? mean(in30.map(e=>e.value)) : mean(vals.slice(-5));
  const mediaLabel= in30.length? '30 días' : 'reciente';
  let trend=null;
  if(vals.length>=2){
    const k=Math.min(3,Math.floor(vals.length/2));
    const prevK=vals.slice(-2*k,-k);
    if(prevK.length) trend=mean(vals.slice(-k))-mean(prevK);
  }
  const key=d=>d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
  const days=new Set(data.map(e=>key(new Date(e.at))));
  let streak=0; const cur=new Date(); cur.setHours(0,0,0,0);
  if(!days.has(key(cur))) cur.setDate(cur.getDate()-1); // tolerancia: si hoy aún no hay, cuenta desde ayer
  while(days.has(key(cur))){ streak++; cur.setDate(cur.getDate()-1); }
  return {last:data[data.length-1], media, mediaLabel, trend, streak};
}
function renderSummary(){
  const el=$('#summary'), s=computeSummary();
  if(!s){ el.innerHTML=''; el.style.display='none'; return; }
  el.style.display='';
  const lc=valColor(s.last.value), lm=moodLabel(s.last.value)[0];
  const mc=valColor(s.media>0?1:s.media<0?-1:0);
  let tArrow='→', tWord='estable', tCol='#8a8a9a', tDelta='—';
  if(s.trend!==null){
    tDelta=(s.trend>0?'+':'')+s.trend.toFixed(1);
    if(s.trend>0.3){ tArrow='↑'; tWord='mejorando'; tCol='#2fae7a'; }
    else if(s.trend<-0.3){ tArrow='↓'; tWord='empeorando'; tCol='#e25a82'; }
  }
  el.innerHTML=`
    <div class="stat"><div class="k">Última</div><div class="v" style="color:${lc}">${s.last.value>0?'+':''}${s.last.value}</div><div class="s">${lm}</div></div>
    <div class="stat"><div class="k">Media</div><div class="v" style="color:${mc}">${s.media>0?'+':''}${s.media.toFixed(1)}</div><div class="s">${s.mediaLabel}</div></div>
    <div class="stat"><div class="k">Tendencia</div><div class="v" style="color:${tCol};font-size:17px">${tArrow} ${tDelta}</div><div class="s">${s.trend!==null?tWord:'sin datos'}</div></div>
    <div class="stat"><div class="k">Racha</div><div class="v">${s.streak}</div><div class="s">día${s.streak===1?'':'s'} seguidos</div></div>`;
}

function corr(pairs,a,b){
  if(pairs.length<3) return null;
  const ma=pairs.reduce((s,x)=>s+x[a],0)/pairs.length;
  const mb=pairs.reduce((s,x)=>s+x[b],0)/pairs.length;
  let num=0, da=0, db=0;
  pairs.forEach(x=>{ const xa=x[a]-ma, xb=x[b]-mb; num+=xa*xb; da+=xa*xa; db+=xb*xb; });
  return da&&db ? num/Math.sqrt(da*db) : 0;
}
function relationWord(r,positive,negative){
  if(r===null) return null;
  if(r>0.28) return positive;
  if(r<-0.28) return negative;
  return 'un patrón todavía suave';
}
function renderRelation(){
  const el=$('#relation');
  const paired=entries
    .map(e=>({value:+e.value,toc:metricValue(e.toc),sleep:metricValue(e.sleep)}))
    .filter(e=>Number.isFinite(e.value)&&e.toc!==null&&e.sleep!==null);
  if(paired.length<3){
    el.textContent='Añade algunos registros con TOC y sueño para ver cómo se relacionan con tu bienestar.';
    return;
  }
  const sleepToc=relationWord(corr(paired,'sleep','toc'),'TOC más alto','TOC más bajo');
  const sleepWell=relationWord(corr(paired,'sleep','value'),'más bienestar','menos bienestar');
  el.textContent=`Patrón, no causa: con ${paired.length} registros, dormir mejor coincide con ${sleepToc} y ${sleepWell}.`;
}
function render(){ renderChart(); renderMetricCharts(); renderList(); renderSummary(); renderRelation(); }

function openSheet(id=null){
  hideTip(); closeMenu(); sfx('open');
  editingId=id;
  const e=id?entries.find(x=>x.id===id):null;
  $('#sheetTitle').textContent=e?'Editar entrada':'Nueva entrada';
  $('#sDelete').style.display=e?'block':'none';
  const v=e?e.value:0;
  $('#sRange').value=v; updateSlider(v);
  const toc=e&&metricValue(e.toc)!==null?metricValue(e.toc):5;
  const sleep=e&&metricValue(e.sleep)!==null?metricValue(e.sleep):5;
  $('#sTocRange').value=toc; updateMetricSlider('toc',toc);
  $('#sSleepRange').value=sleep; updateMetricSlider('sleep',sleep);
  $('#sWhen').value=toLocalInput(e?new Date(e.at):new Date());

  $('#'+prefix+'Mood').style.color=label[1];
}

$('#mExample').addEventListener('click',()=>{ closeMenu(); loadExample(); });

function showSetup(){
  const m=$('#modal');
  const status = schemaMissing ? '<b style="color:var(--bad-ink)">⚠ Falta actualizar Supabase para guardar TOC y sueño.</b><br>'
    : tableMissing ? '<b style="color:var(--bad-ink)">⚠ La tabla aún no existe en tu Supabase.</b><br>'

    : '<b style="color:#c98a1a">Sin conexión ahora mismo.</b> Tus datos se guardan en el dispositivo y se subirán cuando vuelvas a estar online.<br>';

      <button class="btn btn-ghost" style="flex:none;width:auto;padding:0 16px;font-size:14px" onclick="copySQL()">Copiar SQL</button>

/* generic confirm */
function confirmBox(t,msg,okLabel,onOk){

    <div class="sheet-actions">

/* toast */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ════════════════════════════ SONIDO ════════════════════════════ */
const LS_SOUND='rocd_sound_v1';
let soundOn=(localStorage.getItem(LS_SOUND)||'on')==='on';
let _actx=null;
function audioCtx(){
  try{
    if(!_actx) _actx=new (window.AudioContext||window.webkitAudioContext)();
    if(_actx.state==='suspended') _actx.resume();
    return _actx;
  }catch(e){ return null; }
}
function tone(freq,t0,dur,{type='sine',vol=0.05,glideTo=null}={}){
  const ac=_actx; if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(ac.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}
function sfx(name){
  if(!soundOn) return;
  const ac=audioCtx(); if(!ac) return;
  const t=ac.currentTime;
  switch(name){
    case 'tap':     tone(660,t,0.05,{type:'sine',vol:0.03}); break;
    case 'open':    tone(523.25,t,0.09,{type:'sine',vol:0.035}); break;
    case 'success': tone(587.33,t,0.10,{type:'triangle',vol:0.045});
                    tone(880.00,t+0.075,0.16,{type:'triangle',vol:0.04}); break;
    case 'delete':  tone(392,t,0.12,{type:'sine',vol:0.04,glideTo:196}); break;
    case 'toggle':  tone(784,t,0.05,{type:'sine',vol:0.03}); break;
  }
}
function setSoundLabel(){ const el=$('#soundLabel'); if(el) el.textContent=soundOn?'Activados':'Desactivados'; }
$('#mSound').addEventListener('click',e=>{
  e.stopPropagation();
  soundOn=!soundOn; localStorage.setItem(LS_SOUND, soundOn?'on':'off'); setSoundLabel();
  if(soundOn) sfx('toggle');
});

/* ════════════════════════════ TEMA ════════════════════════════ */
const LS_THEME='rocd_theme_v1';
let themeMode=localStorage.getItem(LS_THEME)||'auto';
function effectiveDark(){
  if(themeMode==='dark') return true;
  if(themeMode==='light') return false;
  const h=new Date().getHours();        // automático: oscuro de 19:00 a 07:00
  return h>=19 || h<7;
}
function applyTheme(){
  const dark=effectiveDark();
  document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  const meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.content=dark?'#14141b':'#f3f3f9';
  const lbl=$('#themeLabel'); if(lbl) lbl.textContent= themeMode==='auto'?'Automático':themeMode==='dark'?'Oscuro':'Claro';
}
function cycleTheme(){
  themeMode= themeMode==='auto'?'light' : themeMode==='light'?'dark' : 'auto';
  localStorage.setItem(LS_THEME, themeMode);
  applyTheme(); sfx('toggle');
  toast('Tema: '+(themeMode==='auto'?'Automático':themeMode==='dark'?'Oscuro':'Claro'));
}
$('#mTheme').addEventListener('click',e=>{ e.stopPropagation(); cycleTheme(); });
// Reevaluar el modo automático cuando cambia la hora o al volver a la app.
setInterval(()=>{ if(themeMode==='auto') applyTheme(); }, 60000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&themeMode==='auto') applyTheme(); });

/* ════════════════════════════ TABS ════════════════════════════ */
function switchTab(view){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('#view'+(view==='graf'?'Graf':'Hist')).classList.add('active');
  hideTip(); sfx('tap');
  window.scrollTo(0,0);
  if(view==='graf'){ renderChart(); renderMetricCharts(); }   // re-measure now that it is visible
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.view)));

/* ════════════════════════════ MISC ════════════════════════════ */
$('#fab').addEventListener('click',()=>openSheet());
window.addEventListener('online',()=>{ pull().then(flushQueue); });
window.addEventListener('scroll',()=>{ document.querySelector('header').classList.toggle('scrolled',scrollY>4); },{passive:true});
let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ renderChart(); renderMetricCharts(); },150); });

/* ════════════════════════════ BOOT ════════════════════════════ */
function boot(){
  applyTheme(); setSoundLabel();
  setTitle(title);
  loadLocal(); render();
  setStatus('sync','conectando…');
  initSupabase();
  if('serviceWorker' in navigator){
    let refreshing=false;
    const hadController=!!navigator.serviceWorker.controller;
    // Cuando un service worker nuevo toma el control, recarga para mostrar la última versión.
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(refreshing||!hadController) return;
      refreshing=true; location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.update();
      // Si ya hay una versión nueva esperando, actívala.
      const promote=w=>{ if(w&&w.state==='installed'&&navigator.serviceWorker.controller) w.postMessage('skipWaiting'); };
      if(reg.waiting) promote(reg.waiting);
      reg.addEventListener('updatefound',()=>{ const w=reg.installing; if(w) w.addEventListener('statechange',()=>promote(w)); });
      // Comprueba si hay actualización al volver a la app y cada media hora.
      document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update(); });
      setInterval(()=>reg.update(), 30*60*1000);
    }).catch(()=>{});
  }
}
boot();
</script>
